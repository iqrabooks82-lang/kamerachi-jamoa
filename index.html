<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Kamerachi Jamoa</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#01499E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Kamerachi Jamoa — Mini App
   Brend: ko'k #01499E · to'q sariq #F37C20 · havorang #10D6F9
   Faqat shu blok o'zgartirilsa — boshqa brendga moslashadi.
   ========================================================= */
:root{
  --brand:#01499E; --brand-2:#0B5FC4; --brand-soft:#E8F0FB;
  --accent:#F37C20; --accent-soft:#FEF0E4; --sky:#10D6F9;
  --bg:#FFFFFF; --card:#F4F6F9; --line:#E6E9EF;
  --ink:#0F1A2A; --ink-2:#4A5568; --ink-3:#8A94A6;
  --ok:#1E9E5A; --ok-soft:#E6F6EE; --warn:#E8711A; --warn-soft:#FDEEE2;
  --bad:#D93A3A; --bad-soft:#FBE9E9; --info:#0E8FB8; --info-soft:#E4F6FB;
  --off:#7C5CD6; --off-soft:#EFEAFC; --none:#B8C0CC; --none-soft:#EEF1F5;
  --s-ontime:#2A6FD1; --s-late:#E8711A;
  --r:20px; --r-sm:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Outfit',system-ui,-apple-system,sans-serif;color:var(--ink);font-size:15px;line-height:1.4;
  padding:0 16px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Tepa */
.top{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
.top img{width:44px;height:44px;border-radius:50%}
.top .who{flex:1;min-width:0}
.top .hi{font-size:13px;color:var(--ink-3)}
.top .name{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card);
  font-size:13px;font-weight:500;color:var(--ink-2)}
.demo{background:#FFF6D6;color:#7A5B00;border-radius:var(--r-sm);padding:10px 14px;font-size:13px;margin-bottom:12px}

/* Hero */
.hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;border-radius:24px;padding:18px;
  position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
  border:22px solid rgba(255,255,255,.07)}
.hero .lbl{font-size:13px;opacity:.8}
.hero .big{display:flex;align-items:baseline;gap:8px;margin:2px 0 14px}
.hero .big b{font-size:40px;font-weight:800;letter-spacing:-1px}
.hero .big span{font-size:15px;opacity:.85}
.hero .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.hero .cell{background:rgba(255,255,255,.12);border-radius:var(--r-sm);padding:10px 12px}
.hero .cell b{display:block;font-size:20px;font-weight:700}
.hero .cell small{font-size:12px;opacity:.85}
.hero .cell.alert b{color:#FFD2AE}

/* Tile'lar */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--card);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.tile .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.tile b{font-size:22px;font-weight:700;line-height:1}
.tile b em{font-style:normal;font-size:14px;color:var(--ink-3);font-weight:500}
.tile small{font-size:13px;color:var(--ink-2)}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center}
.tile.wide b{margin-left:4px}

/* Kartochka */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-top:12px}
.card h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card h3 .more{font-size:13px;font-weight:500;color:var(--brand)}
.sub{font-size:13px;color:var(--ink-3);margin-top:2px}

/* Davomat */
.seg{display:flex;gap:2px;height:10px;border-radius:999px;overflow:hidden;margin:14px 0 10px;background:var(--none-soft)}
.seg i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}
.people{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.p{background:#fff;border-radius:var(--r-sm);padding:10px 12px;display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;
  background:var(--brand-soft);color:var(--brand);flex:none}
.p .nm{flex:1;min-width:0}
.p .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .nm small{color:var(--ink-3);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill svg.i{width:14px;height:14px;stroke-width:2.2}
.st-vaqtida{background:var(--ok-soft);color:var(--ok)}
.st-kechikdi{background:var(--warn-soft);color:var(--warn)}
.st-kelmadi{background:var(--bad-soft);color:var(--bad)}
.st-sababli{background:var(--info-soft);color:var(--info)}
.st-dam{background:var(--off-soft);color:var(--off)}
.st-none{background:var(--none-soft);color:var(--ink-3)}

/* Segment tugmalar */
.tabs{display:flex;background:#fff;border-radius:999px;padding:4px;margin-top:12px}
.tabs button{flex:1;padding:8px 10px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.tabs button.on{background:var(--brand);color:#fff}
.tabs button .n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;padding:0 6px;
  margin-left:4px;font-size:12px;background:var(--none-soft);color:var(--ink-2)}
.tabs button.on .n{background:rgba(255,255,255,.2);color:#fff}

/* Task qatori */
.t{background:#fff;border-radius:var(--r-sm);padding:12px;display:flex;gap:10px;align-items:flex-start;margin-top:6px}
.t .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--none)}
.t .dot.h{background:var(--bad)}
.t .tx{flex:1;min-width:0}
.t .tx b{display:block;font-weight:500;line-height:1.35}
.t .meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12.5px;color:var(--ink-3)}
.t .meta span{display:inline-flex;align-items:center;gap:4px}
.t .meta svg.i{width:14px;height:14px}
.t .late{color:var(--bad);font-weight:600}
.empty{background:#fff;border-radius:var(--r-sm);padding:18px;text-align:center;color:var(--ink-3);font-size:13.5px;margin-top:6px}

/* Grafik */
.chart{margin-top:12px;position:relative}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{font-size:10.5px;fill:var(--ink-3)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart rect.b{transition:opacity .15s}
.chart .hit{fill:transparent;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;
  line-height:1.5;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* Reyting */
.rk{background:#fff;border-radius:var(--r-sm);padding:12px;margin-top:6px}
.rk .h{display:flex;align-items:center;gap:10px}
.rk .h .nm{flex:1;min-width:0}
.rk .h .nm b{display:block;font-weight:600}
.rk .h .nm small{color:var(--ink-3);font-size:12.5px}
.rk .pct{font-size:18px;font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--none-soft);margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--s-ontime)}
.rk .st{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2)}
.rk .st span{display:inline-flex;align-items:center;gap:4px}
.rk .st svg.i{width:14px;height:14px}

/* Maosh */
.money{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.money div{background:#fff;border-radius:var(--r-sm);padding:12px}
.money b{display:block;font-size:17px;font-weight:700}
.money small{font-size:12.5px;color:var(--ink-3)}

/* Pastki menyu */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.nav .in{display:flex;gap:4px;max-width:560px;width:100%}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:var(--r-sm);
  font-size:11.5px;font-weight:500;color:var(--ink-3)}
.nav button.on{color:var(--brand)}
.nav button.on svg.i{stroke-width:2.2}

/* Yuklanish / xato */
.sk{background:linear-gradient(90deg,var(--card) 25%,#ECEFF4 50%,var(--card) 75%);background-size:200% 100%;
  animation:sk 1.2s infinite;border-radius:var(--r);margin-top:12px}
@keyframes sk{to{background-position:-200% 0}}
.msg{text-align:center;padding:60px 20px;color:var(--ink-2)}
.msg .ring{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);box-shadow:0 0 0 10px #F3F7FD}
.msg .ring svg.i{width:30px;height:30px}
.msg b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:12px 22px;border-radius:999px;background:var(--brand);
  color:#fff;font-weight:600}
/* Xodim kabineti */
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.qa button{background:#fff;border-radius:var(--r-sm);padding:12px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;text-align:left}
.qa button .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.pend{font-size:13px;color:var(--ink-2);margin-top:10px;display:flex;gap:6px;align-items:center}
.pend svg.i{width:15px;height:15px;color:var(--warn)}
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stg div{background:#fff;border-radius:var(--r-sm);padding:10px 12px}
.stg b{display:block;font-size:18px;font-weight:700}
.stg small{font-size:12px;color:var(--ink-3)}
.dr{background:#fff;border-radius:var(--r-sm);padding:10px 12px;margin-top:6px}
.dr .r1{display:flex;align-items:center;gap:10px}
.dr .d{font-weight:700;width:44px;flex:none}
.dr .tx{flex:1;min-width:0;font-size:13px;color:var(--ink-2)}
.dr .ob{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--brand);padding:0}
.dr .ex{display:block;margin-top:6px;font-size:12.5px;color:var(--warn)}
.disc{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.disc b{font-size:32px;font-weight:800;color:var(--brand);letter-spacing:-1px}
.disc span{color:var(--ink-2);font-size:14px}
.card .tc{background:#fff}
/* Ochilish oynasi (telefon ilovasi) */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:linear-gradient(160deg,#3A95FF 0%,#1F5FCB 45%,#0B2685 80%,#061A6E 100%);color:#fff;transition:opacity .45s ease}
#splash[hidden]{display:none}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(52vw,230px);height:auto;border-radius:50%;box-shadow:0 18px 50px rgba(0,10,60,.35);animation:spIn .6s ease both}
#splash .sp-hi{font-size:22px;font-weight:600;text-align:center;line-height:1.35;padding:0 24px;animation:spIn .6s .15s ease both}
#splash .sp-hi b{font-weight:600}
#splash .sp-hi span{display:block;font-size:28px;font-weight:800}
#splash .sp-dots{display:flex;gap:7px}
#splash .sp-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.85);animation:spDot 1s infinite ease-in-out}
#splash .sp-dots i:nth-child(2){animation-delay:.15s}#splash .sp-dots i:nth-child(3){animation-delay:.3s}
#splash .sp-foot{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));font-size:13px;opacity:.7;letter-spacing:.5px}
@keyframes spIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spDot{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.login{max-width:360px;margin:0 auto;padding:56px 8px 24px;text-align:center}
.login img{width:84px;height:84px;border-radius:50%}
.login h1{font-size:24px;font-weight:800;margin:14px 0 6px;color:var(--ink)}
.login p{color:var(--ink-2);font-size:14.5px;line-height:1.45;margin:0 0 20px}
.login .code{text-align:center;font-size:28px;letter-spacing:10px;font-weight:700;padding:14px}
.login .err{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:10px}
.login .botlink{display:inline-flex;align-items:center;gap:6px;margin-top:6px;color:var(--brand);font-weight:600;text-decoration:none}
.login .botlink[hidden]{display:none}
.login .hint{margin-top:18px}
#mySub{margin-bottom:12px}
.upd{font-size:12px;color:var(--ink-3);text-align:center;margin-top:16px}



/* Maosh */
.mtop{display:flex;align-items:center;gap:8px;margin-top:10px}
.mtop .lbl{flex:1;font-weight:700}
.mc{background:var(--card);border-radius:var(--r-sm);padding:12px 14px;margin-top:8px;cursor:pointer}
.mc .r1{display:flex;align-items:center;gap:10px}
.mc .r1 .nm{flex:1;min-width:0}
.mc .r1 .nm b{display:block;font-weight:600}
.mc .r1 .nm small{color:var(--ink-3);font-size:12.5px}
.mc .sum{font-size:17px;font-weight:700;text-align:right}
.mc .sum small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 46px}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.tag.m{background:var(--bad-soft);color:var(--bad)}
.tag.b{background:var(--ok-soft);color:var(--ok)}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.tag.p{background:var(--ok);color:#fff}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--brand);color:#fff;border-radius:var(--r-sm);padding:14px;margin-top:10px}
.total b{font-size:19px}
.calc{background:var(--card);border-radius:var(--r-sm);padding:4px 14px;margin-top:12px}
.calc div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.calc div:last-child{border-bottom:0}
.calc div span{color:var(--ink-2)}
.calc div.sub span{padding-left:12px;color:var(--ink-3);font-size:13px}
.calc div.sub b{font-weight:500;font-size:13px}
.calc .neg{color:var(--bad)} .calc .pos{color:var(--ok)}
.calc div.tot{font-size:16px}
.calc div.tot b{font-size:18px;color:var(--brand)}
.itm{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;margin-top:6px}
.itm .tx{flex:1;min-width:0;font-size:13.5px}
.itm .tx small{display:block;color:var(--ink-3);font-size:12px}
.itm b{font-size:14px;white-space:nowrap}
.itm button{padding:6px 10px;border-radius:999px;background:#fff;color:var(--bad);font-size:12px;font-weight:600}
.adv{background:var(--card);border-radius:var(--r-sm);padding:12px 14px;margin-top:8px}
.adv .r1{display:flex;justify-content:space-between;gap:10px}
.adv .r1 b{font-size:17px}
.adv .acts{margin-top:10px}
.rl{background:var(--card);border-radius:var(--r-sm);padding:12px 14px;margin-top:8px;display:flex;gap:10px;align-items:center}
.rl .tx{flex:1;min-width:0}
.rl .tx b{display:block;font-weight:600}
.rl .tx small{color:var(--ink-3);font-size:12.5px}
.rl .sm{font-weight:700;white-space:nowrap}
.rl.off{opacity:.55}
.grp{font-size:13px;font-weight:700;color:var(--ink-2);margin:16px 0 0}

/* Tasklar */
.fchips{display:flex;gap:6px;overflow-x:auto;margin:4px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.fchips button.on{background:var(--brand);color:#fff}
.fchips button .n{margin-left:6px;font-size:12px;opacity:.75}
.fchips.small button{padding:6px 12px;font-size:12.5px;background:#fff;border:1.5px solid var(--line)}
.fchips.small button.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.tc{background:var(--card);border-radius:var(--r-sm);padding:12px 14px;margin-top:8px;cursor:pointer}
.tc .top1{display:flex;gap:10px;align-items:flex-start}
.tc .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--none)}
.tc .dot.h{background:var(--bad)}
.tc .mt{flex:1;min-width:0;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc .id{font-size:12px;color:var(--ink-3);flex:none;margin-top:2px}
.tc .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:8px 0 0 18px;font-size:12.5px;color:var(--ink-3)}
.tc .meta span{display:inline-flex;align-items:center;gap:4px}
.tc .meta svg.i{width:14px;height:14px}
.tc .meta .pill{margin-left:auto}
.h-yangi{background:var(--info-soft);color:var(--info)}
.h-korildi{background:var(--brand-soft);color:var(--brand)}
.h-tekshiruvda{background:var(--off-soft);color:var(--off)}
.h-qaytarildi{background:var(--bad-soft);color:var(--bad)}
.h-qabul{background:var(--ok-soft);color:var(--ok)}
.h-bekor{background:var(--none-soft);color:var(--ink-3)}
.h-late{background:var(--bad);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:15;display:flex;align-items:center;gap:8px;
  padding:14px 18px;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;box-shadow:0 8px 24px rgba(1,73,158,.35)}
.fab svg.i{stroke-width:2.4}
.fab[hidden]{display:none}
.info{background:var(--card);border-radius:var(--r-sm);padding:4px 14px;margin-top:12px}
.info div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.info div:last-child{border-bottom:0}
.info div span{color:var(--ink-3)}
.info div b{font-weight:600;text-align:right}
.bigtext{font-size:16px;font-weight:600;line-height:1.4}
.proof{margin-top:12px;background:var(--card);border-radius:var(--r-sm);padding:12px}
.proof img{width:100%;border-radius:12px;display:block;margin-top:8px}
.proof .pt{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.cmts{margin-top:12px}
.cmt{background:var(--card);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:14px}
.cmt small{display:block;color:var(--ink-3);font-size:12px;margin-bottom:2px}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.acts button{flex:1;min-width:120px;padding:13px 10px;border-radius:999px;font-weight:700;background:var(--card);color:var(--ink)}
.acts button.pri{background:var(--brand);color:#fff}
.acts button.ok{background:var(--ok);color:#fff}
.acts button.danger{background:var(--bad-soft);color:var(--bad)}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 .inp{flex:1}
.row2 button{padding:0 16px;border-radius:var(--r-sm);background:var(--brand);color:#fff;font-weight:700}
.seg2{display:flex;background:var(--card);border-radius:999px;padding:4px}
.seg2 button{flex:1;padding:9px 6px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg2 button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.rc{background:var(--card);border-radius:var(--r-sm);padding:12px 14px;margin-top:8px}
.rc .h1{display:flex;gap:10px;align-items:flex-start}
.rc .h1 b{flex:1;font-weight:600;line-height:1.35}
.rc .d{font-size:13px;color:var(--ink-2);margin-top:6px;display:flex;align-items:center;gap:6px}
.rc .d svg.i{width:15px;height:15px}
.rc .btns{display:flex;gap:8px;margin-top:10px}
.rc .btns button{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;background:#fff}
.rc .btns button.del{color:var(--bad)}
.rc.off{opacity:.6}

/* Davomat jadvali */
.datebar{display:flex;align-items:center;gap:8px;margin-top:4px}
.datebar .lbl{flex:1;text-align:center;font-weight:700;font-size:16px}
.datebar .lbl small{display:block;font-size:12px;font-weight:500;color:var(--ink-3)}
.rbtn{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--ink-2)}
.rbtn:disabled{opacity:.35}
.gp{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r-sm);padding:12px;margin-top:12px}
.gp .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.gp .tx{flex:1;min-width:0}
.gp .tx b{display:block;font-weight:600}
.gp .tx small{color:var(--ink-3);font-size:12.5px}
.sbtn{padding:9px 14px;border-radius:999px;background:var(--brand);color:#fff;font-weight:600;font-size:13.5px;white-space:nowrap}
.sbtn.ghost{background:var(--brand-soft);color:var(--brand)}
.p.tap{cursor:pointer}
.p .ex{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .ex.warn{color:var(--bad)}
.chev{color:var(--ink-3)}
/* Pastdan chiqadigan oyna */
.shade{position:fixed;inset:0;background:rgba(15,26,42,.45);opacity:0;transition:opacity .2s;z-index:20}
.shade.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:21;
  padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;transform:translateY(100%);transition:transform .25s ease;
  max-height:88vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 12px}
.sh-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh-h .nm{flex:1}
.sh-h .nm b{display:block;font-size:17px;font-weight:700}
.sh-h .nm small{color:var(--ink-3);font-size:13px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:var(--r-sm);font-weight:600;background:var(--card);text-align:left}
.choice button .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.choice button.sel{outline:2px solid var(--brand);background:var(--brand-soft)}
.wide-btn{grid-column:1/-1}
.fld{margin-top:16px}
.fld > label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 14px;border-radius:999px;background:var(--card);font-weight:600;font-size:14px}
.chips button.sel{background:var(--brand);color:#fff}
.inp{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);font:inherit;background:#fff;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--brand)}
textarea.inp{min-height:80px;resize:vertical}
.photo{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-sm);border:1.5px dashed var(--line);cursor:pointer}
.photo img{width:56px;height:56px;border-radius:12px;object-fit:cover}
.photo .ph{width:56px;height:56px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--ink-3)}
.photo small{display:block;color:var(--ink-3);font-size:12.5px}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:8px}
.save{width:100%;margin-top:18px;padding:15px;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;font-size:15px}
.save:disabled{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:all .2s;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad)}
</style>
</head>
<body>
<div id="splash" hidden><img id="spLogo" alt="Kamerachi"><div class="sp-hi"><b id="spHi">Assalomu alaykum!</b><span id="spName"></span></div><div class="sp-dots"><i></i><i></i><i></i></div><div class="sp-foot">Kamerachi Jamoa</div></div>
<div id="app"></div>
<div class="shade" id="shade" hidden></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<input type="file" id="pick" accept="image/*" capture="environment" hidden>

<script>
/* =========================================================
   SOZLASH: botning Apps Script Web App manzili
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbxF7jq6-DMHDQcES05c2ZK7hKeF-67ZjB7q1TuPKLz_vUqMIXLpI8h6csJ4kt1nNkha/exec';
const LOGO = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI1MCIgZmlsbD0iIzAxNDk5RSIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iNTAiIHI9IjQ1LjYiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIxLjMiLz48Y2lyY2xlIGN4PSI1MC42IiBjeT0iNDIuNSIgcj0iMTUuOCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjMuNiIvPjxjaXJjbGUgY3g9IjUwLjYiIGN5PSI0Mi41IiByPSI4LjgiIGZpbGw9IiNGMzdDMjAiLz48cGF0aCBkPSJNMjkuNiAyNy42YTI2IDI2IDAgMCAwIDAgMjkuOGw0LjQtMy4yYTIxIDIxIDAgMCAxIDAtMjMuNHoiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNNzEuNiAyNy42YTI2IDI2IDAgMCAxIDAgMjkuOGwtNC40LTMuMmEyMSAyMSAwIDAgMCAwLTIzLjR6IiBmaWxsPSIjZmZmIi8+PHRleHQgeD0iNTAiIHk9Ijc2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0iQXJpYWwsSGVsdmV0aWNhLHNhbnMtc2VyaWYiIGZvbnQtd2VpZ2h0PSI5MDAiIGZvbnQtc3R5bGU9Iml0YWxpYyIgZm9udC1zaXplPSIxMS4yIiBsZXR0ZXItc3BhY2luZz0iLjMiPjx0c3BhbiBmaWxsPSIjZmZmIj5LQU1FUkE8L3RzcGFuPjx0c3BhbiBmaWxsPSIjMTBENkY5Ij5DSEk8L3RzcGFuPjwvdGV4dD48L3N2Zz4K';

const tg = window.Telegram && Telegram.WebApp;
const IN_TG = !!(tg && tg.initData);
// Namuna rejimi: manzil sozlanmagan (lokal fayl) yoki ?demo / ?xodim bilan ochilgan
const DEMO = API_URL.indexOf('__') === 0 || (!IN_TG && /[?&](demo|xodim)/.test(location.search));
// Telefon ilovasi (APK/brauzer): Telegram yo'q — bot bergan kod bilan kiriladi, kalit telefonda saqlanadi
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
let TOKEN = store.get('kj_token');

/* Ochilish oynasi: faqat telefon ilovasi / brauzerda (Telegram ichida emas) */
const SPLASH_T0 = Date.now();
function showSplash() {
  const sp = document.getElementById('splash');
  document.getElementById('spLogo').src = LOGO;
  const ism = store.get('kj_ism');
  if (ism) { document.getElementById('spHi').textContent = 'Assalomu alaykum,'; document.getElementById('spName').textContent = ism.split(' ')[0] + '!'; }
  sp.hidden = false;
}
function hideSplash() {
  const sp = document.getElementById('splash');
  if (sp.hidden || sp.classList.contains('out')) return;
  setTimeout(() => { sp.classList.add('out'); setTimeout(() => (sp.hidden = true), 500); }, Math.max(0, 1300 - (Date.now() - SPLASH_T0)));
}
if (!IN_TG && !DEMO) showSplash();
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#ffffff'); } catch (e) {} }

const $app = document.getElementById('app');
const ic = (n, cls) => `<svg class="i ${cls || ''}"><use href="#i-${n}"/></svg>`;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const mln = n => { n = Number(n) || 0; return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace('.0', '') + ' mln' : num(n); };
const initials = s => String(s || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();

const ATT = {
  vaqtida: { l: 'Vaqtida', ic: 'done', c: 'var(--ok)' },
  kechikdi: { l: 'Kechikdi', ic: 'clock', c: 'var(--warn)' },
  kelmadi: { l: 'Kelmadi', ic: 'x', c: 'var(--bad)' },
  sababli: { l: 'Sababli', ic: 'note', c: 'var(--info)' },
  dam: { l: 'Dam olish', ic: 'sun', c: 'var(--off)' },
  none: { l: 'Belgilanmagan', ic: 'dash', c: 'var(--none)' },
};

/* ---------- API ---------- */
async function api(name, extra) {
  if (DEMO) { await new Promise(r => setTimeout(r, 350)); return demoData(name, extra || {}); }
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // oddiy so'rov — CORS preflight bo'lmaydi
    body: JSON.stringify(Object.assign({ api: name }, IN_TG ? { initData: tg.initData } : { token: TOKEN }, extra || {})),
  });
  const d = await r.json();
  if (!IN_TG && (d.error === 'auth' || d.error === 'nouser') && name !== 'login') { logout(d.error === 'nouser'); return new Promise(() => {}); }
  return d;
}

/* ---------- Ilovaga kirish (Telegram tashqarisida) ---------- */
function logout(blocked) {
  TOKEN = null; store.set('kj_token', null); DATA = null;
  showLogin(blocked ? 'Kirish yopilgan. Rahbarga murojaat qiling.' : '');
}
async function showLogin(note) {
  hideSplash();
  document.getElementById('nav').hidden = true;
  document.getElementById('fab').hidden = true;
  $app.innerHTML = `<div class="login">
    <img src="${LOGO}" alt="Kamerachi">
    <h1>Kamerachi Jamoa</h1>
    <p>Telegram'da botga <b>/kirish</b> deb yozing va kelgan 6 xonali kodni kiriting.</p>
    <input class="inp code" id="lgC" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
    <button class="save" id="lgB">Kirish</button>
    <div class="err" id="lgE">${esc(note || '')}</div>
    <a class="botlink" id="lgBot" hidden target="_blank" rel="noopener">${ic('right')}Botni ochish</a>
    <div class="hint">Bir marta kirsangiz, ilova 30 kun eslab qoladi.</div>
  </div>`;
  const C = document.getElementById('lgC'), B = document.getElementById('lgB'), E = document.getElementById('lgE');
  C.oninput = () => { C.value = C.value.replace(/\D/g, '').slice(0, 6); if (C.value.length === 6) B.click(); };
  B.onclick = async () => {
    if (C.value.length !== 6) { E.textContent = '6 xonali kodni kiriting'; return; }
    B.disabled = true; B.textContent = 'Tekshirilmoqda…'; E.textContent = '';
    try {
      const r = await api('login', { code: C.value });
      if (r.token) { TOKEN = r.token; store.set('kj_token', r.token); store.set('kj_ism', r.ism || ''); return load(); }
      E.textContent = { code: 'Kod noto\'g\'ri yoki eskirgan. Botdan yangisini oling.', toomany: 'Juda ko\'p urinish. 10 daqiqadan keyin qayta urinib ko\'ring.', nouser: 'Siz faol xodim emassiz. Rahbarga murojaat qiling.' }[r.error] || 'Xatolik, qayta urinib ko\'ring';
    } catch (e) { E.textContent = 'Internet aloqasini tekshiring'; }
    B.disabled = false; B.textContent = 'Kirish'; C.value = ''; C.focus();
  };
  try { const i = await api('appInfo'); if (i.bot) { const a = document.getElementById('lgBot'); if (a) { a.href = 'https://t.me/' + i.bot; a.hidden = false; } } } catch (e) {}
}

/* ---------- Ekranlar ---------- */
let DATA = null, TAB = 'panel', TASKTAB = 'kech', ROLE = 'leader';

function header(user, sana) {
  return `<div class="top">
    <img src="${LOGO}" alt="Kamerachi">
    <div class="who"><div class="hi">Assalomu alaykum,</div><div class="name">${esc(user.ism)}</div></div>
    <span class="chip">${ic('cal')}${esc(sana)}</span>
  </div>${DEMO ? '<div class="demo">Namuna rejimi: haqiqiy ma\'lumot emas. Telegram ichida ochilganda jonli ma\'lumot ko\'rinadi.</div>' : ''}`;
}

function viewPanel(d) {
  const t = d.tasklar, c = d.davomat.count;
  const staff = d.davomat.list.length;
  const keldi = c.vaqtida + c.kechikdi;
  const ishda = staff - c.dam - c.sababli;
  const oyT = d.xodimlar.reduce((a, p) => a + p.tasks, 0), oyV = d.xodimlar.reduce((a, p) => a + p.vaqtida, 0);
  const oyFoiz = oyT ? Math.round(oyV / oyT * 100) : null;

  const tiles = [
    `<div class="tile"><div class="ic" style="background:var(--ok-soft);color:var(--ok)">${ic('users')}</div>
      <b>${keldi}<em> / ${ishda}</em></b><small>Bugun ishga keldi</small></div>`,
    `<div class="tile"><div class="ic" style="background:var(--brand-soft);color:var(--brand)">${ic('done')}</div>
      <b>${oyFoiz == null ? '—' : oyFoiz + '%'}</b><small>Shu oy vaqtida bajarildi</small></div>`,
  ];
  if (d.hisobot) tiles.push(`<div class="tile"><div class="ic" style="background:var(--info-soft);color:var(--info)">${ic('file')}</div>
      <b>${d.hisobot.topshirdi}<em> / ${d.hisobot.kerak}</em></b><small>Kunlik hisobot</small></div>`);
  if (d.maosh) tiles.push(`<div class="tile"><div class="ic" style="background:var(--accent-soft);color:var(--accent)">${ic('cash')}</div>
      <b>${d.maosh.kutilayotgan}</b><small>Avans so'rovi kutmoqda</small></div>`);

  if (tiles.length % 2) tiles[tiles.length - 1] = tiles[tiles.length - 1].replace('class="tile"', 'class="tile wide"');
  return header(d.user, d.sana) + `
  <div class="hero">
    <div class="lbl">Ochiq tasklar</div>
    <div class="big"><b>${t.ochiq}</b><span>ta, shundan bugun muddati: ${t.bugunMuddat}</span></div>
    <div class="row">
      <div class="cell ${t.kechikkan ? 'alert' : ''}"><b>${t.kechikkan}</b><small>Kechikkan</small></div>
      <div class="cell"><b>${t.tekshiruvda}</b><small>Tekshiruvda</small></div>
      <div class="cell"><b>${t.bugunBajarildi}</b><small>Bugun bajarildi</small></div>
    </div>
  </div>
  <div class="tiles">${tiles.join('')}</div>
  ${attCard(d.davomat)}
  ${taskCard(t)}
  ${chartCard(d.grafik)}
  ${rankCard(d.xodimlar)}
  ${d.maosh ? moneyCard(d.maosh) : ''}

/* Grafik: so'nggi 14 kun — bajarilgan tasklar, vaqtida + kechikib (yig'indi = jami bajarilgan) */
function chartCard(g) {
  const W = 340, H = 170, L = 26, R = 6, T = 10, B = 24;
  const max = Math.max(4, ...g.map(x => x.vaqtida + x.kechikib));
  const step = Math.ceil(max / 4);
  const top = step * 4;
  const cw = (W - L - R) / g.length, bw = Math.min(14, cw * 0.62);
  const y = v => T + (H - T - B) * (1 - v / top);
  let s = '';
  for (let v = 0; v <= top; v += step) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
  g.forEach((d, i) => {
    const x = L + i * cw + (cw - bw) / 2;
    const y0 = y(0), yA = y(d.vaqtida), yB = y(d.vaqtida + d.kechikib);
    const gap = d.vaqtida && d.kechikib ? 2 : 0;
    if (d.vaqtida) s += bar(x, yA, bw, y0 - yA, 'var(--s-ontime)', !d.kechikib);
    if (d.kechikib) s += bar(x, yB, bw, yA - yB - gap, 'var(--s-late)', true);
    if (i % 2 === (g.length - 1) % 2) s += `<text class="ax" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${d.label.slice(0, 5)}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${L + i * cw}" y="${T}" width="${cw}" height="${H - T - B}"/>`;
  });
  const tot = g.reduce((a, d) => a + d.vaqtida + d.kechikib, 0);
  const on = g.reduce((a, d) => a + d.vaqtida, 0);
  return `<div class="card"><h3>Bajarilgan tasklar — 14 kun</h3>
    <div class="sub">${tot ? `${tot} ta bajarildi, ${Math.round(on / tot * 100)}% vaqtida` : 'Hali bajarilgan task yo\'q'}</div>
    <div class="legend" style="margin-top:10px"><span><i style="background:var(--s-ontime);border-radius:2px"></i>Vaqtida</span><span><i style="background:var(--s-late);border-radius:2px"></i>Kechikib</span></div>
    <div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="So'nggi 14 kunda bajarilgan tasklar">${s}</svg><div class="tip" id="tip"></div></div></div>`;
}
function bar(x, y, w, h, color, roundTop) {
  if (h <= 0) return '';
  const r = Math.min(4, h, w / 2);
  if (!roundTop) return `<rect class="b" x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}"/>`;
  return `<path class="b" fill="${color}" d="M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z"/>`;
}

function rankCard(list) {
  const sorted = list.slice().sort((a, b) => (b.foiz == null ? -1 : b.foiz) - (a.foiz == null ? -1 : a.foiz));
  const rows = sorted.map(p => `<div class="rk"><div class="h"><div class="av">${esc(initials(p.ism))}</div>
      <div class="nm"><b>${esc(p.ism)}</b><small>${p.tasks ? `${p.vaqtida} / ${p.tasks} task vaqtida` : 'Shu oy task yo\'q'}</small></div>
      <div class="pct">${p.foiz == null ? '—' : p.foiz + '%'}</div></div>

      <div class="st"><span>${ic('list')}Ochiq ${p.ochiq}</span><span>${ic('clock')}Kechikish ${p.kechikish}</span><span>${ic('x')}Kelmadi ${p.kelmadi}</span></div></div>`).join('');
  return `<div class="card"><h3>Xodimlar — shu oy</h3><div class="sub">Tasklarni vaqtida bajarish foizi bo'yicha</div>${rows}</div>`;

function renderAtt() {

    if (k === 'kechikdi') ex = `${p.keldi} da keldi · +${p.kech} daq`;
    else if (k === 'vaqtida' && p.keldi) ex = `${p.keldi} da keldi`;

/* Rasm tanlash va siqish (1280px, JPEG) */
function pickPhoto() {
  return new Promise(resolve => {
    const inp = document.getElementById('pick');
    inp.value = '';
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; if (!f) return resolve(null);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => resolve(null);
      img.src = URL.createObjectURL(f);
    };
    inp.click();
  });
}

function openMark(p) {
  M = { p, holat: p.holat === 'dam' ? '' : p.holat, keldi: '', izoh: p.izoh || '', photo: null, ketdi: '', early: false };

  sh.hidden = false; requestAnimationFrame(() => { sh.classList.add('on'); s.classList.add('on'); });
  sh.onclick = closeSheet;
  haptic();
}
function closeSheet() {
  const sh = document.getElementById('shade'), s = document.getElementById('sheet');
  sh.classList.remove('on'); s.classList.remove('on');
  setTimeout(() => (sh.hidden = true), 250);
}

function lateChips() {
  const st = ATTD.start.split(':').map(Number), base = st[0] * 60 + st[1];
  return [15, 30, 45, 60, 90].map(m => { const t = base + m; return ('0' + Math.floor(t / 60)).slice(-2) + ':' + ('0' + t % 60).slice(-2); });
}

function drawSheet() {
  const p = M.p, k = M.holat;
  const cur = p.holat ? ATT[p.holat].l + (p.holat === 'kechikdi' ? ` · ${p.keldi} (+${p.kech} daq)` : '') : 'Belgilanmagan';
  const opt = (h, icon, label, color, soft) => `<button data-h="${h}" class="${k === h && !M.early ? 'sel' : ''}">
    <span class="ic" style="background:${soft};color:${color}">${ic(icon)}</span>${label}</button>`;
  let form = '';
  const needPhoto = (k === 'kechikdi') || (k === 'vaqtida' && p.self);
  if (M.early) {
    form = `<div class="fld"><label>Soat nechida ketdi?</label><input type="time" class="inp" id="fEarly" value="${M.ketdi}"></div>
      <div class="hint">Ish tugashi: ${ATTD.end}</div>`;
  } else if (k === 'kechikdi') {
    form = `<div class="fld"><label>Soat nechida keldi?</label><div class="chips" id="fChips">${lateChips().map(t => `<button data-t="${t}" class="${M.keldi === t ? 'sel' : ''}">${t}</button>`).join('')}</div>
      <input type="time" class="inp" id="fTime" style="margin-top:8px" value="${M.keldi}"></div>`;
  } else if (k === 'sababli') {
    form = `<div class="fld"><label>Sababi</label><textarea class="inp" id="fIzoh" placeholder="Masalan: shifokorga bordi">${esc(M.izoh)}</textarea></div>`;
  }
  if (needPhoto && !M.early) {
    form += `<div class="fld"><label>Kamera kadri${p.self ? ' (o\'zingiz)' : ''}</label>
      <div class="photo" id="fPhoto">${M.photo ? `<img src="${M.photo}" alt="">` : `<span class="ph">${ic('cam')}</span>`}
      <div><b>${M.photo ? 'Kadr tanlandi' : 'Rasm tanlash'}</b><small>${M.photo ? 'Almashtirish uchun bosing' : 'Majburiy — botdagidek dalil bo\'lib saqlanadi'}</small></div></div></div>`;
  }
  if (k === 'vaqtida' && !p.self && !M.early) form += `<div class="hint">${ATTD.groupPhoto ? 'Umumiy kamera kadri dalil sifatida biriktiriladi.' : 'Umumiy kadr yuklanmagan — rasm biriktirilmaydi.'}</div>`;

  const canEarly = p.holat === 'vaqtida' || p.holat === 'kechikdi';
  const ready = M.early ? !!M.ketdi
    : k === 'kechikdi' ? !!(M.keldi && M.photo)
    : k === 'sababli' ? !!M.izoh.trim()
    : k === 'vaqtida' ? (!p.self || !!M.photo)
    : !!k;

  document.getElementById('sheet').innerHTML = `<div class="grab"></div>
    <div class="sh-h"><div class="av">${esc(initials(p.ism))}</div><div class="nm"><b>${esc(p.ism)}${p.self ? ' (siz)' : ''}</b>
      <small>${ATTD.today ? 'Bugun' : ATTD.label}: ${esc(cur)}${p.holat === 'dam' ? ' (tasdiqlangan)' : ''}</small></div></div>
    <div class="choice" id="fChoice">
      ${opt('vaqtida', 'done', 'Vaqtida', 'var(--ok)', 'var(--ok-soft)')}
      ${opt('kechikdi', 'clock', 'Kechikdi', 'var(--warn)', 'var(--warn-soft)')}
      ${opt('kelmadi', 'x', 'Kelmadi', 'var(--bad)', 'var(--bad-soft)')}
      ${opt('sababli', 'note', 'Sababli', 'var(--info)', 'var(--info-soft)')}
      ${canEarly ? `<button data-h="early" class="wide-btn ${M.early ? 'sel' : ''}"><span class="ic" style="background:var(--off-soft);color:var(--off)">${ic('run')}</span>Erta ketdi</button>` : ''}
    </div>
    ${form}
    <button class="save" id="fSave" ${ready ? '' : 'disabled'}>Saqlash</button>`;

  document.getElementById('fChoice').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.h === 'early') { M.early = true; } else { M.early = false; M.holat = b.dataset.h; }
    haptic(); drawSheet();
  };
  const chips = document.getElementById('fChips');
  if (chips) chips.onclick = e => { const b = e.target.closest('button'); if (!b) return; M.keldi = b.dataset.t; haptic(); drawSheet(); };
  const ft = document.getElementById('fTime'); if (ft) ft.onchange = () => { M.keldi = ft.value; drawSheet(); };
  const fe = document.getElementById('fEarly'); if (fe) fe.onchange = () => { M.ketdi = fe.value; drawSheet(); };
  const fi = document.getElementById('fIzoh'); if (fi) fi.oninput = () => { M.izoh = fi.value; document.getElementById('fSave').disabled = !M.izoh.trim(); };
  const fp = document.getElementById('fPhoto'); if (fp) fp.onclick = async () => { const ph = await pickPhoto(); if (ph) { M.photo = ph; drawSheet(); } };
  document.getElementById('fSave').onclick = saveMark;
}

async function saveMark() {
  const b = document.getElementById('fSave');

    if (d.error === 'forbidden') { $app.innerHTML = viewSoonMsg('Tasklar', 'Bu bo\'lim rahbar va menejerlar uchun.'); return; }
    if (d.error || r.error) throw new Error(d.error || r.error);
    TK.data = d; TK.recs = r.recs; renderTasks();
  } catch (e) { $app.innerHTML = viewSoonMsg('Aloqa yo\'q', 'Qayta urinib ko\'ring.'); }
}

function tkFilter(list) {
  const f = TK.f;
  let l = list.filter(t => f === 'ochiq' ? OPEN.includes(t.holat) : f === 'kech' ? t.late : f === 'tek' ? t.holat === 'tekshiruvda' : f === 'done' ? t.holat === 'qabul' : false);
  if (TK.who !== 'all') l = l.filter(t => t.kimga === TK.who);
  if (f === 'ochiq' || f === 'kech') l.sort((a, b) => (a.deadline || '9') < (b.deadline || '9') ? -1 : 1);
  return l;
}

function renderTasks() {
  if (TAB !== 'tasklar') return;
  const all = TK.data.tasks;
  const n = { ochiq: all.filter(t => OPEN.includes(t.holat)).length, kech: all.filter(t => t.late).length, tek: all.filter(t => t.holat === 'tekshiruvda').length };
  const fb = (k, l, c) => `<button data-f="${k}" class="${TK.f === k ? 'on' : ''}">${l}${c != null ? `<span class="n">${c}</span>` : ''}</button>`;
  let body = '';
  if (TK.f === 'rec') {
    body = TK.recs.length ? TK.recs.map(r => `<div class="rc ${r.faol ? '' : 'off'}" data-id="${r.id}"><div class="h1">${r.muhim ? '<i class="dot h" style="width:8px;height:8px;border-radius:50%;background:var(--bad);margin-top:7px"></i>' : ''}<b>${esc(r.matn)}</b></div>
      <div class="d">${ic('repeat')}${esc(r.desc)}</div><div class="d">${ic('users')}${esc(r.kimga.join(', '))}</div>
      <div class="btns"><button data-a="tog">${r.faol ? 'To\'xtatish' : 'Yoqish'}</button><button class="del" data-a="del">O'chirish</button></div></div>`).join('')
      : `<div class="empty">Takroriy task yo'q. Masalan: "Kassa hisoboti — har kuni 18:00".</div>`;
  } else {
    const users = TK.data.users.filter(u => all.some(t => t.kimga === u.id));
    const people = `<div class="fchips small" id="tkWho" style="margin-top:10px"><button data-w="all" class="${TK.who === 'all' ? 'on' : ''}">Hammasi</button>${users.map(u => `<button data-w="${u.id}" class="${TK.who === u.id ? 'on' : ''}">${esc(u.ism.split(' ')[0])}</button>`).join('')}</div>`;
    const list = tkFilter(all);
    body = people + (list.length ? list.map(t => {
      const pill = t.late ? `<span class="pill h-late">${fmtLate(t.kechSoat)} kechikdi</span>` : `<span class="pill h-${t.holat}">${HOLAT[t.holat] || t.holat}</span>`;
      return `<div class="tc" data-id="${t.id}"><div class="top1"><i class="dot ${t.muhim ? 'h' : ''}"></i><div class="mt">${esc(t.matn)}</div><span class="id">#${t.id}</span></div>
        <div class="meta"><span>${ic('user')}${esc(t.self ? 'O\'zim' : t.kimgaIsm)}</span><span>${ic('clock')}${esc(t.holat === 'qabul' && t.bajarilgan ? t.bajarilgan : t.dl)}</span>${t.rec ? `<span>${ic('repeat')}</span>` : ''}${pill}</div></div>`;
    }).join('') : `<div class="empty">Bu bo'limda task yo'q.</div>`);
  }
  $app.innerHTML = header(DATA.user, DATA.sana) + `<div class="fchips" id="tkF">${fb('ochiq', 'Ochiq', n.ochiq)}${fb('kech', 'Kechikkan', n.kech)}${fb('tek', 'Tekshiruvda', n.tek)}${fb('done', 'Bajarilgan')}${fb('rec', 'Takroriy', TK.recs.length)}</div>${body}<div style="height:70px"></div>`;

  document.getElementById('tkF').onclick = e => { const b = e.target.closest('button'); if (!b) return; TK.f = b.dataset.f; haptic(); renderTasks(); };
  const w = document.getElementById('tkWho');
  if (w) w.onclick = e => { const b = e.target.closest('button'); if (!b) return; TK.who = b.dataset.w; haptic(); renderTasks(); };
  $app.querySelectorAll('.tc').forEach(el => (el.onclick = () => openTask(+el.dataset.id)));
  $app.querySelectorAll('.rc').forEach(el => (el.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'del' && !b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Rostdan o\'chirilsinmi?'; return; }
    b.disabled = true;
    const r = await api(b.dataset.a === 'del' ? 'recDelete' : 'recToggle', { id: el.dataset.id });
    if (r.error) return toast(TERR[r.error] || 'Xatolik', true);
    TK.recs = r.recs; renderTasks(); toast(b.dataset.a === 'del' ? 'O\'chirildi' : 'Saqlandi');
  }));
  const fab = document.getElementById('fab');
  fab.hidden = false;
  fab.innerHTML = TK.f === 'rec' ? `${ic('plus')}Takroriy task` : `${ic('plus')}Yangi task`;
  fab.onclick = () => (TK.f === 'rec' ? openRecForm() : openTaskForm());
}

function showSheet(html) {
  document.getElementById('sheet').innerHTML = '<div class="grab"></div>' + html;
  const sh = document.getElementById('shade'), s = document.getElementById('sheet');
  if (!s.classList.contains('on')) { sh.hidden = false; requestAnimationFrame(() => { sh.classList.add('on'); s.classList.add('on'); }); sh.onclick = closeSheet; }
}

/* ---------- Task kartasi ---------- */
async function openTask(id) {
  showSheet('<div class="sk" style="height:220px;margin:0"></div>'); haptic();
  const r = await api('myTaskGet', { id });
  if (r.error) { closeSheet(); return toast(TERR[r.error] || 'Xatolik', true); }
  drawTask(r.task);
}

function drawTask(t) {
  const open = OPEN.includes(t.holat);
  const status = t.late ? `<span class="pill h-late">${fmtLate(t.kechSoat)} kechikdi</span>` : `<span class="pill h-${t.holat}">${HOLAT[t.holat] || t.holat}</span>`;
  const proofLbl = { photo: 'Foto', text: 'Izoh', none: 'Kerak emas' }[t.isbot] || 'Kerak emas';
  let html = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="id" style="color:var(--ink-3);font-size:13px">#${t.id}${t.rec ? ' · takroriy' : ''}</span><span style="flex:1"></span>${status}</div>
    <div class="bigtext">${t.muhim ? '<span style="color:var(--bad)">● </span>' : ''}${esc(t.matn)}</div>
    <div class="info"><div><span>Ijrochi</span><b>${esc(t.self ? 'O\'zim' : t.kimgaIsm)}</b></div>${t.self ? '' : `<div><span>Bergan</span><b>${esc(t.bergan)}</b></div>`}
    <div><span>Muddat</span><b>${esc(t.dl)}</b></div><div><span>Isbot</span><b>${proofLbl}</b></div>
    ${t.bajarilgan ? `<div><span>Bajarildi</span><b>${esc(t.bajarilgan)}${t.vaqtida === false ? ' · kechikib' : t.vaqtida ? ' · vaqtida' : ''}</b></div>` : ''}</div>`;
  if (t.qaytarishSababi && t.holat === 'qaytarildi') html += `<div class="proof"><div class="pt">Qaytarish sababi</div>${esc(t.qaytarishSababi)}</div>`;
  if (t.rasm || t.isbotIzoh) html += `<div class="proof"><div class="pt">Isbot</div>${t.isbotIzoh ? esc(t.isbotIzoh) : ''}${t.rasm ? `<img src="${t.rasm}" alt="Isbot">` : ''}</div>`;
  if (t.izohlar.length) html += `<div class="cmts"><div class="fld" style="margin-top:0"><label>Izohlar</label></div>${t.izohlar.map(c => `<div class="cmt"><small>${esc(c.kim)} · ${esc(c.vaqt)}${c.turi === 'tosiq' ? ' · to\'siq' : ''}</small>${esc(c.matn)}</div>`).join('')}</div>`;

  const acts = [];
  if (t.canManage && t.holat === 'tekshiruvda') acts.push(`<button class="ok" data-a="accept">Qabul qilish</button>`, `<button data-a="returnForm">Qaytarish</button>`);
  if (t.canManage && open && !t.self) acts.push(`<button data-a="remind">Eslatish</button>`);
  if (t.canManage && open) acts.push(`<button data-a="extForm">Muddat</button>`, `<button class="danger" data-a="cancel">Bekor qilish</button>`);
  if (t.mine && open) acts.unshift(`<button class="ok" data-a="doneForm">Bajardim</button>`);
  if (t.mine && open && !t.self) acts.push(`<button data-a="askExt">Muddat so'rash</button>`);
  if (acts.length) html += `<div class="acts" id="tActs">${acts.join('')}</div>`;
  html += `<div id="tForm"></div>`;
  if (t.holat !== 'qabul' && t.holat !== 'bekor') html += `<div class="fld"><label>Izoh yozish</label><div class="row2"><input class="inp" id="tCmt" placeholder="${t.mine && !t.self ? 'Rahbarga' : 'Xodimga'} xabar boradi"><button id="tCmtB">${ic('right')}</button></div></div>`;
  showSheet(html);

  const run = async (act, extra, okMsg) => {
    const mineAct = t.mine && ['done', 'ext', 'comment'].includes(act);
    const r = await api(mineAct ? 'myTaskAct' : 'taskAction', Object.assign({ id: t.id, act }, extra || {}));
    if (r.error) { document.querySelectorAll('#sheet button').forEach(b => (b.disabled = false)); return toast(TERR[r.error] || 'Xatolik', true); }
    toast(okMsg); drawTask(r.task); afterTaskChange();
  };
  const A = document.getElementById('tActs');
  if (A) A.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    const a = b.dataset.a, F = document.getElementById('tForm');
    if (a === 'returnForm') { F.innerHTML = `<div class="fld"><label>Qaytarish sababi</label><textarea class="inp" id="tSab" placeholder="Nima to'g'rilanishi kerak?"></textarea></div><button class="save" id="tSabB">Qaytarish</button>`;
      document.getElementById('tSabB').onclick = () => run('return', { sabab: document.getElementById('tSab').value }, 'Qaytarildi'); return; }
    if (a === 'extForm') { F.innerHTML = `<div class="fld"><label>Yangi muddat</label><div class="chips" id="tExtC"><button data-v="${atTime(0, 18)}">Bugun 18:00</button><button data-v="${atTime(1, 10)}">Ertaga 10:00</button><button data-v="${atTime(1, 18)}">Ertaga 18:00</button></div>
        <input type="datetime-local" class="inp" id="tExt" style="margin-top:8px" value="${t.deadline}"></div><button class="save" id="tExtB">Saqlash</button>`;
      document.getElementById('tExtC').onclick = e2 => { const c = e2.target.closest('button'); if (c) document.getElementById('tExt').value = c.dataset.v; };
      document.getElementById('tExtB').onclick = () => run('extend', { deadline: document.getElementById('tExt').value }, 'Muddat o\'zgartirildi'); return; }
    if (a === 'doneForm') { doneForm(t, F, run); return; }
    if (a === 'askExt') { F.innerHTML = `<div class="fld"><label>Qachongacha?</label><div class="chips" id="tExtC"><button data-v="${atTime(0, 18)}">Bugun 18:00</button><button data-v="${atTime(1, 10)}">Ertaga 10:00</button><button data-v="${atTime(1, 18)}">Ertaga 18:00</button></div>
        <input type="datetime-local" class="inp" id="tExt" style="margin-top:8px" value="${t.deadline}"></div>
        <div class="fld"><label>Sababi</label><textarea class="inp" id="tExtS" placeholder="Nega ulgurmayapsiz?"></textarea></div><button class="save" id="tExtB">Rahbarga yuborish</button>`;
      document.getElementById('tExtC').onclick = e2 => { const c = e2.target.closest('button'); if (c) document.getElementById('tExt').value = c.dataset.v; };
      document.getElementById('tExtB').onclick = e2 => { e2.target.disabled = true; run('ext', { deadline: document.getElementById('tExt').value, sabab: document.getElementById('tExtS').value }, 'So\'rov rahbarga yuborildi'); }; return; }
    if (a === 'cancel' && !b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Rostdan bekor qilinsinmi?'; return; }
    b.disabled = true;
    run(a, {}, { accept: 'Qabul qilindi', remind: 'Eslatma yuborildi', cancel: 'Bekor qilindi' }[a]);
  };
  const cb = document.getElementById('tCmtB');
  if (cb) cb.onclick = () => { const v = document.getElementById('tCmt').value.trim(); if (!v) return; cb.disabled = true; run('comment', { matn: v }, 'Izoh yuborildi'); };
}

let RF = null;

function openRecForm() { RF = { matn: '', kimga: [], vaqt: '18:00', davr: 'kunlik', kunlar: [], prio: 'n', isbot: 'none' }; drawRecForm(); haptic(); }
function drawRecForm() {
  let days = '';
  if (RF.davr === 'haftalik') days = `<div class="chips" id="rfW" style="margin-top:8px">${WDN.map((d, i) => `<button data-v="${i + 1}" class="${RF.kunlar.includes(String(i + 1)) ? 'sel' : ''}">${d}</button>`).join('')}</div>`;

  if (g('rfM')) g('rfM').oninput = () => (RF.kunlar = g('rfM').value ? [String(Math.min(31, Math.max(1, +g('rfM').value)))] : []);

    TK.recs = r.recs; closeSheet(); renderTasks(); toast(r.note || 'Saqlandi');
  };
}


/* =========================================================
   Maosh (rahbar)
   ========================================================= */
const SL = { v: 'jamoa', off: 0, team: null, adv: null, kpi: null, kpiOff: 0, rules: null };
const SERR = Object.assign({}, TERR, { nosalary: 'Bu xodimga oylik kiritilmagan', summa: 'Summani to\'g\'ri yozing', izoh: 'Sababini yozing', nomi: 'Nomini yozing', shart: 'Shartni tanlang', maqsad: 'Maqsadni yozing', fakt: 'Natijani yozing', nopay: 'To\'lanadigan summa yo\'q', rule: 'Qoida topilmadi' });
const som = n => num(n) + ' so\'m';
/* "500000", "500 ming", "1.5 mln", "1,5mln" → son */
function parseSum(t) {
  const m = String(t || '').toLowerCase().replace(/so['ʻ’]?m/g, '').replace(/\s+/g, '').replace(',', '.').match(/^(\d+(?:\.\d+)?)(k|ming|mln|million|m)?$/);
  if (!m) return null;
  let n = parseFloat(m[1]);
  if (m[2] === 'k' || m[2] === 'ming') n *= 1e3;
  if (m[2] === 'mln' || m[2] === 'million' || m[2] === 'm') n *= 1e6;
  return Math.round(n);
}

  } catch (e) { $app.innerHTML = viewSoonMsg('Aloqa yo\'q', 'Qayta urinib ko\'ring.'); }
}

async function salLoad(v) {
  SL.v = v;
  try {
    if (v === 'kpi') { const r = await api('kpiList', { off: SL.kpiOff }); if (r.error) throw 0; SL.kpi = r; }
    if (v === 'qoida') { const r = await api('rules'); if (r.error) throw 0; SL.rules = r; }
    if (v === 'avans') { const r = await api('advList'); if (r.error) throw 0; SL.adv = r.list; }
    if (v === 'jamoa') { const r = await api('salTeam', { off: SL.off }); if (r.error) throw 0; SL.team = r; }
  } catch (e) { return toast('Aloqa yo\'q', true); }
  renderSal();
}

function renderSal() {
  if (TAB !== 'maosh') return;
  const sub = (k, l, n) => `<button data-v="${k}" class="${SL.v === k ? 'on' : ''}">${l}${n ? `<span class="n">${n}</span>` : ''}</button>`;
  let body = '';
  const monthBar = (off, id) => `<div class="mtop"><div class="lbl">${off ? 'O\'tgan oy' : 'Shu oy'}</div><div class="seg2" id="${id}" style="width:200px"><button data-o="0" class="${off ? '' : 'on'}">Shu oy</button><button data-o="1" class="${off ? 'on' : ''}">O'tgan oy</button></div></div>`;

  if (SL.v === 'jamoa') {
    const t = SL.team;
    body = monthBar(SL.off, 'slM') + `<div class="sub" style="margin-top:6px">${t.label}${SL.off ? ' · to\'lash uchun xodimni bosing' : ' · hozirgacha hisoblangan'}</div>` +
      (t.list.length ? t.list.map(p => `<div class="mc" data-id="${p.id}"><div class="r1"><div class="av">${esc(initials(p.ism))}</div>
        <div class="nm"><b>${esc(p.ism)}</b><small>Oylik ${mln(p.oylik)} · ${p.kun}-sanada</small></div>
        <div class="sum">${som(p.qolga)}<small>qo'lga</small></div></div>
        <div class="tags">${p.minus ? `<span class="tag m">−${mln(p.minus)}</span>` : ''}${p.bonus ? `<span class="tag b">+${mln(p.bonus)}</span>` : ''}${p.avans ? `<span class="tag a">avans ${mln(p.avans)}</span>` : ''}${p.tolandi && p.qolga <= 0 ? '<span class="tag p">To\'langan</span>' : ''}</div></div>`).join('')
        + `<div class="total"><span>Jami qo'lga</span><b>${som(t.jami)}</b></div>`
        : `<div class="empty">Maosh varag'ida oylik kiritilgan xodim yo'q.</div>`);
  }
  if (SL.v === 'avans') {
    body = SL.adv.length ? SL.adv.map(a => `<div class="adv" data-h="${a.hid}"><div class="r1"><div><b style="font-size:15px">${esc(a.ism)}</b><div class="sub">${esc(a.sana)}${a.sabab ? ' · ' + esc(a.sabab) : ''}</div></div><b>${som(a.summa)}</b></div>
      ${a.summa > a.qolga ? `<div class="hint" style="color:var(--bad)">So'ralgan summa shu oy qolganidan (${som(a.qolga)}) ko'p</div>` : `<div class="hint">Shu oy qolgan: ${som(a.qolga)}</div>`}
      <div class="acts"><button class="ok" data-ok="1">Berildi</button><button class="danger" data-ok="0">Rad etish</button></div></div>`).join('')
      : `<div class="empty">Kutilayotgan avans so'rovi yo'q.</div>`;
  }
  if (SL.v === 'kpi') {
    const k = SL.kpi;
    body = monthBar(SL.kpiOff, 'kpM') + (k.list.length ? k.list.map(r => `<div class="mc" data-row="${r.row}"><div class="r1"><div class="av">${esc(initials(r.ism))}</div>
      <div class="nm"><b>${esc(r.ism)} — ${esc(r.nomi)}</b><small>${r.pending ? 'Maqsad ' + num(r.maqsad) + ' · natija kiritilmagan' : num(r.fakt) + ' / ' + num(r.maqsad) + ' (' + r.pct + '%)'}</small></div>
      <div class="sum">${r.pending ? mln(r.full) : som(r.summa)}<small>${r.pending ? (r.foiz ? 'foizga qarab' : '100% bo\'lsa') : 'bonus'}</small></div></div>
      ${r.pending ? '' : `<div class="bar" style="margin:8px 0 0 46px"><i style="width:${Math.min(100, r.pct)}%"></i></div>`}</div>`).join('')
      : `<div class="empty">Bu oyga KPI qo'yilmagan.${k.rules.length ? '' : ' Avval «Qoidalar»da KPI usulidagi bonus qoidasini qo\'shing.'}</div>`);
  }
  if (SL.v === 'qoida') {
    const R = SL.rules.rules;
    const grp = t => R.filter(q => q.turi === t).map(q => `<div class="rl ${q.faol ? '' : 'off'}" data-id="${q.id}"><div class="tx"><b>${esc(q.nomi)}</b><small>${esc(q.label)}${q.faol ? '' : ' · o\'chirilgan'}</small></div><span class="sm">${t === 'jarima' ? '−' : '+'}${mln(q.summa)}</span></div>`).join('') || `<div class="empty">Yo'q</div>`;
    body = `<div class="grp">Jarimalar</div>${grp('jarima')}<div class="grp">Bonuslar</div>${grp('bonus')}`;
  }

  $app.innerHTML = header(DATA.user, DATA.sana) + `<div class="fchips" id="slV">${sub('jamoa', 'Jamoa')}${sub('avans', 'Avans so\'rovlari', SL.adv ? SL.adv.length : 0)}${sub('kpi', 'KPI')}${sub('qoida', 'Qoidalar')}</div>${body}<div style="height:70px"></div>`;

  document.getElementById('slV').onclick = e => { const b = e.target.closest('button'); if (!b) return; haptic(); salLoad(b.dataset.v); };
  const sm = document.getElementById('slM'); if (sm) sm.onclick = e => { const b = e.target.closest('button'); if (!b) return; SL.off = +b.dataset.o; salLoad('jamoa'); };
  const km = document.getElementById('kpM'); if (km) km.onclick = e => { const b = e.target.closest('button'); if (!b) return; SL.kpiOff = +b.dataset.o; salLoad('kpi'); };
  if (SL.v === 'jamoa') $app.querySelectorAll('.mc').forEach(el => (el.onclick = () => openPerson(el.dataset.id, SL.off)));
  if (SL.v === 'kpi') $app.querySelectorAll('.mc').forEach(el => (el.onclick = () => openKpi(SL.kpi.list.find(r => String(r.row) === el.dataset.row))));
  if (SL.v === 'qoida') $app.querySelectorAll('.rl').forEach(el => (el.onclick = () => openRule(SL.rules.rules.find(q => q.id === el.dataset.id))));
  $app.querySelectorAll('.adv').forEach(el => (el.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    b.disabled = true;
    const r = await api('advDecide', { hid: el.dataset.h, ok: b.dataset.ok === '1' });
    if (r.error) return toast(SERR[r.error] || 'Xatolik', true);
    SL.adv = r.list; renderSal(); toast(b.dataset.ok === '1' ? 'Avans berildi, xabar ketdi' : 'Rad etildi');
  }));
  const fab = document.getElementById('fab');
  const fl = { jamoa: 'Yozish', avans: '', kpi: 'KPI qo\'yish', qoida: 'Qoida' }[SL.v];
  fab.hidden = !fl;
  fab.innerHTML = `${ic('plus')}${fl}`;
  fab.onclick = () => (SL.v === 'kpi' ? openKpiForm() : SL.v === 'qoida' ? openRuleForm() : openGiveForm());
}

/* ---------- Xodim kartasi ---------- */
async function openPerson(id, off) {
  showSheet('<div class="sk" style="height:260px;margin:0"></div>'); haptic();
  const r = await api('salPerson', { id, off });
  if (r.error) { closeSheet(); return toast(SERR[r.error] || 'Xatolik', true); }
  drawPerson(r);
}
function drawPerson(c) {
  const row = (l, v, cls, sub) => `<div class="${sub ? 'sub' : ''}"><span>${l}</span><b class="${cls || ''}">${v}</b></div>`;
  let calc = row('Oylik', som(c.oylik)) + row('Kunlik stavka (÷' + c.ishKunlari + ')', som(c.kunlik), '', true);
  if (c.absent.length) calc += row('Sababsiz kelmagan: ' + c.absent.length + ' kun', '−' + som(c.absent.length * c.kunlik), 'neg');
  if (c.offCut.length) calc += row('Limitdan ortiq dam: ' + c.offCut.length + ' kun', '−' + som(c.offCut.length * c.kunlik), 'neg');
  if (c.ushQolda) calc += row('Boshqa ushlashlar', '−' + som(c.ushQolda), 'neg');
  if (c.jarima) calc += row('Jarimalar', '−' + som(c.jarima), 'neg');
  c.auto.filter(a => a.turi === 'jarima').forEach(a => (calc += row(a.nomi + (a.count > 1 ? ' ×' + a.count : '') + ' (avto)', '−' + som(a.summa), '', true)));
  if (c.bonus) calc += row('Bonuslar', '+' + som(c.bonus), 'pos');
  c.auto.filter(a => a.turi === 'bonus').forEach(a => (calc += row(a.nomi + ' (avto)', a.pending ? 'oy yakunida' : '+' + som(a.summa), '', true)));
  c.kpi.forEach(k => (calc += row('KPI: ' + k.nomi, k.pending ? 'natija yo\'q' : k.pct + '% → +' + som(k.summa), '', true)));
  calc += row('Hisoblandi', som(c.hisoblandi));
  if (c.avans) calc += row('Olingan avans', '−' + som(c.avans), 'neg');
  if (c.tolandi) calc += row('To\'langan', '−' + som(c.tolandi), 'neg');
  calc += `<div class="tot"><span>Qo'lga tegadi</span><b>${som(c.qolga)}</b></div>`;
  const icn = { avans: 'Avans', jarima: 'Jarima', bonus: 'Bonus', ushlash: 'Ushlash', tolov: 'To\'lov' };
  const items = c.items.length ? `<div class="fld"><label>Yozuvlar</label></div>` + c.items.map(i => `<div class="itm" data-h="${i.id}"><div class="tx">${icn[i.turi] || i.turi}${i.sabab ? ': ' + esc(i.sabab) : ''}<small>${esc(i.sana)}</small></div><b>${som(i.summa)}</b><button>Bekor</button></div>`).join('') : '';
  showSheet(`<div class="sh-h"><div class="av">${esc(initials(c.ism))}</div><div class="nm"><b>${esc(c.ism)}</b><small>${esc(c.label)} · ${esc(c.tolovKuni)}</small></div></div>
    <div class="calc">${calc}</div>${items}
    ${c.canPay ? `<button class="save" id="pPay" style="background:var(--ok)">To'landi: ${som(c.qolga)}</button><div class="hint" style="text-align:center">Xodimga to'liq hisob-kitob bilan xabar boradi</div>` : ''}`);
  document.querySelectorAll('.itm button').forEach(b => (b.onclick = async () => {
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Rostdanmi?'; return; }
    b.disabled = true;
    const r = await api('salCancel', { hid: b.closest('.itm').dataset.h, off: c.off });
    if (r.error) return toast(SERR[r.error] || 'Xatolik', true);
    drawPerson(r); toast('Bekor qilindi, xabar ketdi'); salLoad('jamoa');
  }));
  const pb = document.getElementById('pPay');
  if (pb) pb.onclick = async () => {
    if (!pb.dataset.sure) { pb.dataset.sure = 1; pb.textContent = 'Tasdiqlang: ' + som(c.qolga) + ' to\'landi'; return; }
    pb.disabled = true;
    const r = await api('salPay', { id: c.id, prefix: c.prefix });
    if (r.error) { pb.disabled = false; return toast(SERR[r.error] || 'Xatolik', true); }
    drawPerson(r); toast('To\'landi, xodimga xabar ketdi'); salLoad('jamoa');
  };
}

/* ---------- Jarima / bonus / avans yozish ---------- */
let GF = null;
async function openGiveForm() {
  if (!SL.rules) { const r = await api('rules'); if (!r.error) SL.rules = r; }
  GF = { turi: 'jarima', id: '', qid: '', summa: '', izoh: '' };
  drawGive(); haptic();
}
function drawGive() {
  const users = SL.team.list;
  const rules = (SL.rules ? SL.rules.rules : []).filter(q => q.turi === GF.turi && q.usul === 'qolda' && q.faol);
  showSheet(`<div class="bigtext" style="margin-bottom:4px">Hisobga yozish</div>
    <div class="fld"><div class="seg2" id="gT"><button data-v="jarima" class="${GF.turi === 'jarima' ? 'on' : ''}">Jarima</button><button data-v="bonus" class="${GF.turi === 'bonus' ? 'on' : ''}">Bonus</button><button data-v="avans" class="${GF.turi === 'avans' ? 'on' : ''}">Avans</button></div></div>
    <div class="fld"><label>Kimga</label><div class="chips" id="gU">${users.map(u => `<button data-v="${u.id}" class="${GF.id === u.id ? 'sel' : ''}">${esc(u.ism.split(' ')[0])}</button>`).join('')}</div></div>
    ${GF.turi !== 'avans' && rules.length ? `<div class="fld"><label>Qoida</label><div class="chips" id="gR">${rules.map(q => `<button data-v="${q.id}" class="${GF.qid === q.id ? 'sel' : ''}">${esc(q.nomi)} · ${mln(q.summa)}</button>`).join('')}<button data-v="" class="${GF.qid === '' ? 'sel' : ''}">Boshqa summa</button></div></div>` : ''}
    ${GF.qid ? '' : `<div class="fld"><label>Summa</label><input class="inp" id="gS" inputmode="decimal" placeholder="Masalan: 50 ming yoki 1.5 mln" value="${esc(GF.summa)}"></div>`}
    <div class="fld"><label>Izoh ${GF.turi === 'avans' ? '(ixtiyoriy)' : '(xodim ko\'radi)'}</label><input class="inp" id="gI" value="${esc(GF.izoh)}" placeholder="${GF.turi === 'bonus' ? 'Masalan: oyning eng yaxshi sotuvchisi' : GF.turi === 'jarima' ? 'Masalan: mijozga qo\'pol javob' : 'Masalan: naqd berildi'}"></div>
    <button class="save" id="gSave">Yozish</button>`);
  const g = id => document.getElementById(id);
  const keep = () => { if (g('gS')) GF.summa = g('gS').value; GF.izoh = g('gI').value; };
  g('gT').onclick = e => { const b = e.target.closest('button'); if (!b) return; keep(); GF.turi = b.dataset.v; GF.qid = ''; drawGive(); };
  g('gU').onclick = e => { const b = e.target.closest('button'); if (!b) return; keep(); GF.id = b.dataset.v; drawGive(); };
  if (g('gR')) g('gR').onclick = e => { const b = e.target.closest('button'); if (!b) return; keep(); GF.qid = b.dataset.v; drawGive(); };
  g('gSave').onclick = async () => {
    keep();
    if (!GF.id) return toast('Xodimni tanlang', true);
    const summa = GF.qid ? 0 : parseSum(GF.summa);
    if (!GF.qid && !summa) return toast(SERR.summa, true);
    g('gSave').disabled = true;
    const r = await api('salGive', { turi: GF.turi, id: GF.id, qoida_id: GF.qid, summa, izoh: GF.izoh });
    if (r.error) { g('gSave').disabled = false; return toast(SERR[r.error] || 'Xatolik', true); }
    closeSheet(); toast('Yozildi, xodimga xabar ketdi'); salLoad('jamoa');
  };
}

/* ---------- KPI ---------- */
function openKpi(k) {
  showSheet(`<div class="sh-h"><div class="av">${esc(initials(k.ism))}</div><div class="nm"><b>${esc(k.ism)} — ${esc(k.nomi)}</b><small>Maqsad ${num(k.maqsad)} · bonus ${som(k.full)}${k.foiz ? ' (foizga qarab)' : ' (100% bo\'lsa)'}</small></div></div>
    <div class="fld"><label>Natija</label><input class="inp" id="kF" inputmode="decimal" placeholder="Masalan: 48 mln yoki 27" value="${k.pending ? '' : k.fakt}"></div>
    <button class="save" id="kS">Saqlash</button>
    <div class="acts"><button class="danger" id="kX">KPI ni bekor qilish</button></div>`);
  document.getElementById('kS').onclick = async () => {
    const v = parseSum(document.getElementById('kF').value) ?? (/^\d+$/.test(document.getElementById('kF').value.trim()) ? +document.getElementById('kF').value.trim() : null);
    if (v == null) return toast(SERR.fakt, true);
    const r = await api('kpiFact', { row: k.row, fakt: v });
    if (r.error) return toast(SERR[r.error] || 'Xatolik', true);
    SL.kpi = r; closeSheet(); renderSal(); toast('Saqlandi, xodimga natija ketdi');
  };
  const x = document.getElementById('kX');
  x.onclick = async () => {
    if (!x.dataset.sure) { x.dataset.sure = 1; x.textContent = 'Rostdan bekor qilinsinmi?'; return; }
    const r = await api('kpiCancel', { row: k.row });
    if (r.error) return toast(SERR[r.error] || 'Xatolik', true);
    SL.kpi = r; closeSheet(); renderSal(); toast('Bekor qilindi');
  };
}
let KF = null;
function openKpiForm() {
  if (!SL.kpi.rules.length) return toast('Avval «Qoidalar»da KPI usulidagi bonus qoidasini qo\'shing', true);
  KF = { id: '', qid: SL.kpi.rules[0].id, nomi: '', maqsad: '' }; drawKpiForm(); haptic();
}
function drawKpiForm() {
  const k = SL.kpi;
  showSheet(`<div class="bigtext" style="margin-bottom:4px">Shu oy uchun KPI</div>
    <div class="fld"><label>Kimga</label><div class="chips" id="kU">${k.users.map(u => `<button data-v="${u.id}" class="${KF.id === u.id ? 'sel' : ''}">${esc(u.ism.split(' ')[0])}</button>`).join('')}</div></div>
    <div class="fld"><label>Bonus qoidasi</label><div class="chips" id="kR">${k.rules.map(q => `<button data-v="${q.id}" class="${KF.qid === q.id ? 'sel' : ''}">${esc(q.nomi)} · ${mln(q.summa)}${q.foiz ? ' · %' : ''}</button>`).join('')}</div></div>
    <div class="fld"><label>Ko'rsatkich nomi (ixtiyoriy)</label><input class="inp" id="kN" value="${esc(KF.nomi)}" placeholder="Masalan: Sotuv summasi"></div>
    <div class="fld"><label>Maqsad</label><input class="inp" id="kM" inputmode="decimal" value="${esc(KF.maqsad)}" placeholder="Masalan: 60 mln yoki 30 (post soni)"></div>
    <button class="save" id="kSave">Qo'yish</button>`);
  const g = id => document.getElementById(id);
  const keep = () => { KF.nomi = g('kN').value; KF.maqsad = g('kM').value; };
  g('kU').onclick = e => { const b = e.target.closest('button'); if (!b) return; keep(); KF.id = b.dataset.v; drawKpiForm(); };
  g('kR').onclick = e => { const b = e.target.closest('button'); if (!b) return; keep(); KF.qid = b.dataset.v; drawKpiForm(); };
  g('kSave').onclick = async () => {
    keep();
    if (!KF.id) return toast('Xodimni tanlang', true);
    const m = parseSum(KF.maqsad) ?? (/^\d+$/.test(KF.maqsad.trim()) ? +KF.maqsad.trim() : null);
    if (!m) return toast(SERR.maqsad, true);
    const r = await api('kpiCreate', { id: KF.id, qoida_id: KF.qid, nomi: KF.nomi, maqsad: m });
    if (r.error) return toast(SERR[r.error] || 'Xatolik', true);
    SL.kpi = r; SL.kpiOff = 0; closeSheet(); renderSal(); toast('KPI qo\'yildi, xodimga xabar ketdi');
  };
}

/* ---------- Qoidalar ---------- */
function openRule(q) {
  showSheet(`<div class="bigtext">${esc(q.nomi)}</div><div class="sub" style="margin-top:4px">${q.turi === 'jarima' ? 'Jarima' : 'Bonus'} · ${som(q.summa)} · ${esc(q.label)}</div>
    <div class="acts"><button id="rT">${q.faol ? 'O\'chirib qo\'yish' : 'Yoqish'}</button><button class="danger" id="rD">O'chirish</button></div>`);
  const done = (r, msg) => { if (r.error) return toast(SERR[r.error] || 'Xatolik', true); SL.rules = r; closeSheet(); renderSal(); toast(msg); };
  document.getElementById('rT').onclick = async () => done(await api('ruleToggle', { id: q.id }), 'Saqlandi');
  const d = document.getElementById('rD');
  d.onclick = async () => { if (!d.dataset.sure) { d.dataset.sure = 1; d.textContent = 'Rostdan o\'chirilsinmi?'; return; } done(await api('ruleDelete', { id: q.id }), 'O\'chirildi'); };
}
let RL = null;
function openRuleForm() { RL = { turi: 'jarima', nomi: '', summa: '', usul: 'qolda', shart: '' }; drawRuleForm(); haptic(); }
function drawRuleForm() {
  const opts = RL.usul === 'avto' ? SL.rules.auto[RL.turi] : RL.usul === 'kpi' ? SL.rules.kpi : null;
  showSheet(`<div class="bigtext" style="margin-bottom:4px">Yangi qoida</div>
    <div class="fld"><div class="seg2" id="qT"><button data-v="jarima" class="${RL.turi === 'jarima' ? 'on' : ''}">Jarima</button><button data-v="bonus" class="${RL.turi === 'bonus' ? 'on' : ''}">Bonus</button></div></div>
    <div class="fld"><label>Nomi</label><input class="inp" id="qN" value="${esc(RL.nomi)}" placeholder="${RL.turi === 'jarima' ? 'Masalan: Kechikish' : 'Masalan: Sotuv rejasi'}"></div>
    <div class="fld"><label>Summa</label><input class="inp" id="qS" inputmode="decimal" value="${esc(RL.summa)}" placeholder="Masalan: 20 ming yoki 500 ming"></div>
    <div class="fld"><label>Qanday qo'llanadi</label><div class="seg2" id="qU"><button data-v="qolda" class="${RL.usul === 'qolda' ? 'on' : ''}">Qo'lda</button><button data-v="avto" class="${RL.usul === 'avto' ? 'on' : ''}">Avto</button>${RL.turi === 'bonus' ? `<button data-v="kpi" class="${RL.usul === 'kpi' ? 'on' : ''}">KPI</button>` : ''}</div>
      <div class="hint">${RL.usul === 'qolda' ? 'Siz o\'zingiz «Yozish» orqali berasiz.' : RL.usul === 'avto' ? 'Bot davomat va tasklardan o\'zi hisoblaydi.' : 'Oy boshida maqsad qo\'yiladi, natijaga qarab beriladi.'}</div></div>
    ${opts ? `<div class="fld"><label>${RL.usul === 'kpi' ? 'Bonus qanday hisoblansin' : 'Qachon qo\'llansin'}</label><div class="chips" id="qH">${Object.keys(opts).map(k => `<button data-v="${k}" class="${RL.shart === k ? 'sel' : ''}">${esc(opts[k])}</button>`).join('')}</div></div>` : ''}
    <button class="save" id="qSave">Saqlash</button>`);
  const g = id => document.getElementById(id);
  const keep = () => { RL.nomi = g('qN').value; RL.summa = g('qS').value; };
  g('qT').onclick = e => { const b = e.target.closest('button'); if (!b) return; keep(); RL.turi = b.dataset.v; if (RL.usul === 'kpi' && RL.turi === 'jarima') RL.usul = 'qolda'; RL.shart = ''; drawRuleForm(); };
  g('qU').onclick = e => { const b = e.target.closest('button'); if (!b) return; keep(); RL.usul = b.dataset.v; RL.shart = RL.usul === 'kpi' ? 'toliq' : ''; drawRuleForm(); };
  if (g('qH')) g('qH').onclick = e => { const b = e.target.closest('button'); if (!b) return; keep(); RL.shart = b.dataset.v; drawRuleForm(); };
  g('qSave').onclick = async () => {
    keep();
    const summa = parseSum(RL.summa);
    if (!RL.nomi.trim()) return toast(SERR.nomi, true);
    if (!summa) return toast(SERR.summa, true);
    if (RL.usul === 'avto' && !RL.shart) return toast(SERR.shart, true);
    const r = await api('ruleCreate', { turi: RL.turi, nomi: RL.nomi, summa, usul: RL.usul, shart: RL.shart });
    if (r.error) return toast(SERR[r.error] || 'Xatolik', true);
    SL.rules = r; closeSheet(); renderSal(); toast('Qoida qo\'shildi');
  };
}

/* =========================================================
   Xodim kabineti: Bosh sahifa · Tasklarim · Davomatim · Maoshim
   Xodimlar uchun pastki menyu shu bo'limlar; rahbarlarda «Men» tabi.
   ========================================================= */
const MY = { v: 'home', home: null, tasks: null, tf: 'ochiq', att: null, attOff: 0, sal: null, salOff: 0 };
const MYERR = Object.assign({}, TERR, { early: 'Dam olish kamida 1 kun oldin so\'raladi', dup: 'Bu sanaga so\'rovingiz allaqachon bor', advpend: 'Javob kutayotgan avans so\'rovingiz bor', nosalary: 'Oyligingiz hali kiritilmagan', summa: 'Summani to\'g\'ri yozing (kamida 1 000)', matn: 'Matnni yozing' });

const NAVS = {
  leader: [['panel', 'grid', 'Panel'], ['davomat', 'check', 'Davomat'], ['tasklar', 'list', 'Tasklar'], ['maosh', 'wallet', 'Maosh'], ['men', 'user', 'Men']],
  staff: [['me-home', 'grid', 'Bosh sahifa'], ['me-tasks', 'list', 'Tasklarim'], ['me-att', 'check', 'Davomatim'], ['me-sal', 'wallet', 'Maoshim']],
};
function buildNav() {
  document.getElementById('navIn').innerHTML = NAVS[ROLE].map(([k, i, l]) => `<button data-tab="${k}" class="${TAB === k ? 'on' : ''}">${ic(i)}${l}</button>`).join('');

}

async function loadStaff() {
  const h = await api('myHome');
  if (h.error) return showError('Xatolik', 'Server javob bermadi. Birozdan keyin qayta urinib ko\'ring.', true);
  ROLE = 'staff'; TAB = 'me-home'; MY.v = 'home'; MY.home = h;
  DATA = { user: h.user, sana: h.sana }; store.set('kj_ism', h.user.ism);
  buildNav(); render(); hideSplash();
}

const myActive = v => (TAB === 'men' && MY.v === v) || TAB === 'me-' + v;
const myHead = () => header(DATA.user, DATA.sana) + (TAB === 'men'
  ? `<div class="fchips" id="mySub">${[['home', 'Bosh sahifa'], ['tasks', 'Tasklarim'], ['att', 'Davomatim'], ['sal', 'Maoshim']].map(([k, l]) => `<button data-v="${k}" class="${MY.v === k ? 'on' : ''}">${l}</button>`).join('')}</div>` : '');
function bindSub() {
  const s = document.getElementById('mySub');
  if (s) s.onclick = e => { const b = e.target.closest('button'); if (!b) return; haptic(); openMy(b.dataset.v); };
}

async function openMy(v) {
  MY.v = v;
  const have = { home: MY.home, tasks: MY.tasks, att: MY.att, sal: MY.sal }[v];
  if (have) renderMy(); else $app.innerHTML = myHead() + '<div class="sk" style="height:150px;border-radius:24px"></div><div class="sk" style="height:240px"></div>';
  bindSub();
  try {
    if (v === 'home') MY.home = await api('myHome');
    if (v === 'tasks') MY.tasks = (await api('myTasks')).tasks;
    if (v === 'att') MY.att = await api('myAtt', { off: MY.attOff });
    if (v === 'sal') MY.sal = await api('mySalary', { off: MY.salOff });
    const d = { home: MY.home, tasks: MY.tasks, att: MY.att, sal: MY.sal }[v];
    if (!d || d.error) throw new Error(d && d.error);
    renderMy();
  } catch (e) { if (myActive(v)) { $app.innerHTML = myHead() + `<div class="msg"><div class="ring">${ic('refresh')}</div><b>Aloqa yo'q</b>Qayta urinib ko'ring.</div>`; bindSub(); } }
}

function renderMy() {
  const v = MY.v;
  if (!myActive(v)) return;
  document.getElementById('fab').hidden = true;
  if (v === 'home') viewMyHome(MY.home);
  if (v === 'tasks') viewMyTasks();
  if (v === 'att') viewMyAtt(MY.att);
  if (v === 'sal') viewMySal(MY.sal);
  bindSub();
}

function goMy(v) {
  if (ROLE === 'staff') { TAB = 'me-' + v; document.querySelectorAll('.nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === TAB)); }
  window.scrollTo(0, 0); openMy(v);
}

/* ---------- Tasklarim ---------- */
function viewMyTasks() {
  const all = MY.tasks;
