/* Bajardim: isbot turiga qarab rasm / izoh */
function doneForm(t, F, run) {
  const need = t.self ? 'none' : t.isbot;
  if (need === 'none') {
    F.innerHTML = `<div class="hint">${t.self ? 'Task bajarildi deb yopiladi.' : 'Rahbarga tekshirish uchun yuboriladi.'}</div><button class="save" id="dnB" style="background:var(--ok)">Bajarildi</button>`;
    document.getElementById('dnB').onclick = e => { e.target.disabled = true; run('done', {}, t.self ? 'Bajarildi' : 'Rahbarga yuborildi'); };
    return;
  }
  let photo = null;
  F.innerHTML = `<div class="fld"><label>${need === 'photo' ? 'Isbot rasmi (majburiy)' : 'Rasm (ixtiyoriy)'}</label>
      <button class="sbtn ghost" id="dnP" style="width:100%;display:flex;align-items:center;justify-content:center;gap:6px">${ic('cam')}Rasm yuklash</button><div id="dnPv"></div></div>
    <div class="fld"><label>${need === 'text' ? 'Nima qilindi? (rasm bo\'lmasa majburiy)' : 'Izoh (ixtiyoriy)'}</label><textarea class="inp" id="dnT" placeholder="Qisqacha yozing"></textarea></div>
    <button class="save" id="dnB" style="background:var(--ok)">Rahbarga yuborish</button>`;
  document.getElementById('dnP').onclick = async () => {
    const p = await pickPhoto(); if (!p) return;
    photo = p; document.getElementById('dnPv').innerHTML = `<img src="${p}" alt="" style="width:100%;border-radius:12px;margin-top:8px">`;
    document.getElementById('dnP').innerHTML = `${ic('cam')}Boshqa rasm`;
  };
  document.getElementById('dnB').onclick = e => {
    const izoh = document.getElementById('dnT').value.trim();
    if (need === 'photo' && !photo) return toast('Isbot rasmini yuklang', true);
    if (need === 'text' && !photo && !izoh) return toast('Nima qilinganini yozing', true);
    e.target.disabled = true; e.target.textContent = 'Yuborilmoqda…';
    run('done', { photo: photo || '', izoh }, 'Rahbarga yuborildi');
  };
}

/* ---------- Davomatim ---------- */
function viewMyAtt(d) {
  const c = d.c;
  const rows = d.list.map(r => {
    const k = r.holat || 'none', s = ATT[k] || ATT.none;
    let ex = '';
    if (k === 'kechikdi') ex = `${r.keldi} da · +${r.kech} daq`;
    else if (k === 'vaqtida' && r.keldi) ex = `${r.keldi} da keldingiz`;
    else if (k === 'sababli' && r.izoh) ex = r.izoh;
    else if (k === 'dam' && r.izoh) ex = r.izoh;
    if (r.erta) ex += (ex ? ' · ' : '') + `${r.ketdi} da ketdingiz (−${r.erta} daq)`;
    const canObj = !r.etiroz && (['kechikdi', 'kelmadi', 'sababli'].includes(k) || r.erta);
    return `<div class="dr" data-s="${r.sana}"><div class="r1"><span class="d">${r.label}</span><span class="tx">${esc(ex)}</span><span class="pill st-${k}">${ic(s.ic)}${s.l}</span></div>
      ${r.etiroz ? `<span class="ex">E'tirozingiz: ${esc(r.etiroz)}</span>` : ''}${canObj ? `<button class="ob">E'tiroz bildirish</button><div class="of"></div>` : ''}</div>`;
  }).join('');

  const dam = d.dam.length ? `<div class="card"><h3>Dam olish so'rovlarim</h3>${d.dam.map(r => `<div class="itm" style="background:#fff"><div class="tx">${esc(r.sana)}${r.sabab ? `<small>${esc(r.sabab)}</small>` : ''}</div><span class="pill ${r.holat === 'tasdiqlandi' ? 'st-vaqtida' : r.holat === 'kutilmoqda' ? 'st-kechikdi' : 'st-kelmadi'}">${DH[r.holat] || esc(r.holat)}</span></div>`).join('')}</div>` : '';

  $app.innerHTML = myHead() + `<div class="mtop"><div class="lbl">${esc(d.label)}</div><div class="seg2" id="maM" style="width:200px"><button data-o="0" class="${d.off ? '' : 'on'}">Shu oy</button><button data-o="1" class="${d.off ? 'on' : ''}">O'tgan oy</button></div></div>
    <div class="card"><h3>Intizom</h3>
      <div class="disc"><b>${d.discipline == null ? '—' : d.discipline + '%'}</b><span>vaqtida kelgan kunlar ulushi</span></div>
      <div class="stg">
        <div><b style="color:var(--ok)">${c.vaqtida}</b><small>Vaqtida</small></div>
        <div><b style="color:var(--warn)">${c.kechikdi}</b><small>Kechikdi${d.lateMin ? ' · ' + d.lateMin + ' daq' : ''}</small></div>
        <div><b style="color:var(--bad)">${c.kelmadi}</b><small>Kelmadi</small></div>
        <div><b style="color:var(--info)">${c.sababli}</b><small>Sababli</small></div>
        <div><b style="color:var(--off)">${c.dam}<em style="font-style:normal;font-size:13px;color:var(--ink-3)"> / ${d.limit}</em></b><small>Dam olish</small></div>
        <div><b>${d.early}</b><small>Erta ketish${d.earlyMin ? ' · ' + d.earlyMin + ' daq' : ''}</small></div>
      </div></div>
    <div class="card"><h3>Kunlar</h3>${rows || `<div class="empty">Bu oyda belgilangan kun yo'q.</div>`}</div>
    ${dam}<div style="height:70px"></div>`;

  document.getElementById('maM').onclick = async e => { const b = e.target.closest('button'); if (!b) return; MY.attOff = +b.dataset.o; MY.att = null; haptic(); openMy('att'); };
  $app.querySelectorAll('.dr .ob').forEach(b => (b.onclick = () => {
    const box = b.nextElementSibling, sana = b.closest('.dr').dataset.s;
    b.hidden = true;
    box.innerHTML = `<textarea class="inp" placeholder="Nima noto'g'ri belgilangan?" style="margin-top:8px"></textarea><button class="save" style="margin-top:8px">Rahbarga yuborish</button>`;
    box.querySelector('button').onclick = async e => {
      const matn = box.querySelector('textarea').value.trim();
      if (!matn) return toast('E\'tirozingizni yozing', true);
      e.target.disabled = true;
      const r = await api('attObj', { sana, matn });
      if (r.error) { e.target.disabled = false; return toast(MYERR[r.error] || 'Xatolik', true); }
      MY.att = r; renderMy(); toast('E\'tiroz rahbarga yuborildi');
    };
  }));
  const fab = document.getElementById('fab');
  fab.hidden = false; fab.innerHTML = `${ic('sun')}Dam olish so'rash`; fab.onclick = () => openOffForm();
}

/* ---------- Maoshim ---------- */
function viewMySal(c) {
  const monthBar = `<div class="mtop"><div class="lbl">${c.nosalary ? 'Maosh' : esc(c.label)}</div><div class="seg2" id="msM" style="width:200px"><button data-o="0" class="${MY.salOff ? '' : 'on'}">Shu oy</button><button data-o="1" class="${MY.salOff ? 'on' : ''}">O'tgan oy</button></div></div>`;
  if (c.nosalary) {
    $app.innerHTML = myHead() + `<div class="msg"><div class="ring">${ic('wallet')}</div><b>Oyligingiz hali kiritilmagan</b>Rahbarga murojaat qiling.</div>`;
    return;
  }
  const row = (l, v, cls, sub) => `<div class="${sub ? 'sub' : ''}"><span>${l}</span><b class="${cls || ''}">${v}</b></div>`;
  let calc = row('Oylik', som(c.oylik)) + row('Kunlik stavka (÷' + c.ishKunlari + ')', som(c.kunlik), '', true);
  if (c.absent.length) calc += row('Sababsiz kelmagan: ' + c.absent.length + ' kun (' + c.absent.join(', ') + ')', '−' + som(c.absent.length * c.kunlik), 'neg');
  if (c.offCut.length) calc += row('Limitdan ortiq dam: ' + c.offCut.length + ' kun', '−' + som(c.offCut.length * c.kunlik), 'neg');
  if (c.ushQolda) calc += row('Boshqa ushlashlar', '−' + som(c.ushQolda), 'neg');
  if (c.jarima) calc += row('Jarimalar', '−' + som(c.jarima), 'neg');
  c.auto.filter(a => a.turi === 'jarima').forEach(a => (calc += row(a.nomi + (a.count > 1 ? ' ×' + a.count : '') + ' (avto)', '−' + som(a.summa), '', true)));
  if (c.bonus) calc += row('Bonuslar', '+' + som(c.bonus), 'pos');
  c.auto.filter(a => a.turi === 'bonus').forEach(a => (calc += row(a.nomi + ' (avto)', a.pending ? 'oy yakunida' : '+' + som(a.summa), '', true)));
  c.kpi.forEach(k => (calc += row('KPI: ' + k.nomi, k.pending ? 'maqsad ' + num(k.maqsad) + ', natija yo\'q' : num(k.fakt) + ' / ' + num(k.maqsad) + ' → +' + som(k.summa), '', true)));
  calc += row('Hisoblandi', som(c.hisoblandi));
  if (c.avans) calc += row('Olingan avans', '−' + som(c.avans), 'neg');
  if (c.tolandi) calc += row('To\'langan', '−' + som(c.tolandi), 'neg');

  }
  const myT = DM.tasks;
  const find = id => myT.find(t => t.id === +id);
  const full = t => Object.assign({}, t, { mine: true, canManage: false, qaytarishSababi: '', isbotIzoh: t.izohP || '', rasm: t.rasmP || '', izohlar: t.izohlar || [] });
  const sal = () => {
    const avans = DM.items.filter(i => i.turi === 'avans').reduce((a, i) => a + i.summa, 0);
    const c = { off: MY.salOff, label: MY.salOff ? 'Oktabr 2026' : 'Noyabr 2026', oylik: 1000000, kunlik: 38462, ishKunlari: 26, absent: [DM.att[3].label], offCut: [], ushKun: 38462, ushQolda: 0,
      jarima: 40000 + 20000, bonus: 0, avans, tolandi: 0, auto: [{ turi: 'jarima', nomi: 'Kechikish', count: 1, summa: 20000, pending: false }], kpi: [{ nomi: 'Sotuv', maqsad: 50, fakt: 0, pct: 0, summa: 0, pending: true }],
      items: DM.items, tolovKuni: 'To\'lov kuni: 10.12.2026', canPay: false, advPending: DM.advPending };
    c.hisoblandi = c.oylik - c.ushKun - c.jarima + c.bonus; c.qolga = c.hisoblandi - c.avans; return c;
  };
  const att = () => {
    const c = { vaqtida: 0, kechikdi: 0, kelmadi: 0, sababli: 0, dam: 0 };
    DM.att.forEach(r => c[r.holat]++);
    return { off: MY.attOff, label: MY.attOff ? 'Oktabr 2026' : 'Noyabr 2026', c, lateMin: 25, early: 1, earlyMin: 50, discipline: Math.round(c.vaqtida / (c.vaqtida + c.kechikdi + c.kelmadi) * 100), limit: 4,
      list: JSON.parse(JSON.stringify(DM.att)), dam: DM.dam.slice(), tomorrow: shiftDay(tk, 1) };
  };
  if (name === 'myHome') {
    const open = myT.filter(t => OPEN.includes(t.holat)).sort((a, b) => a.deadline < b.deadline ? -1 : 1);
    const s = sal();
    return { user: { ism: 'Yormuhammad', lavozim: 'Sotuvchi' }, sana: new Date().toLocaleDateString('ru-RU'),
      tasks: { ochiq: open.length, kech: open.filter(t => t.late).length, tek: myT.filter(t => t.holat === 'tekshiruvda').length, bugun: open.filter(t => t.deadline.slice(0, 10) === tk).length, list: open.slice(0, 4) },
      att: { today: DM.att[0], tracked: true, start: '09:00', discipline: att().discipline, c: att().c, limit: 4 },
      sal: { hisoblandi: s.hisoblandi, avans: s.avans, qolga: s.qolga, tolovKuni: '10.12.2026' },
      pending: { off: DM.dam.filter(d => d.holat === 'kutilmoqda').map(d => d.sana), adv: DM.advPending ? [DM.advPending] : [] } };
  }
  if (name === 'myTasks') return { tasks: JSON.parse(JSON.stringify(myT)) };
  if (name === 'myTaskGet') {
    const t = find(x.id);
    if (!t) return demoTasks('taskGet', x);
    if (t.holat === 'yangi') t.holat = 'korildi';
    return { task: full(t) };
  }
  if (name === 'myTaskAct') {
    const t = find(x.id);
    if (x.act === 'done') { if (t.isbot === 'photo' && !x.photo) return { error: 'photo' }; t.holat = 'tekshiruvda'; t.late = false; t.bajarilgan = new Date().toTimeString().slice(0, 5); t.izohP = x.izoh || ''; t.rasmP = x.photo || ''; }
    if (x.act === 'ext') { if (!x.sabab) return { error: 'sabab' }; }
    if (x.act === 'comment') { t.izohlar = (t.izohlar || []).concat({ kim: 'Yormuhammad', turi: 'izoh', matn: x.matn, vaqt: 'hozir' }); }
    return { task: full(t) };
  }
  if (name === 'myAtt') return att();
  if (name === 'attObj') { DM.att.find(r => r.sana === x.sana).etiroz = x.matn; return att(); }
  if (name === 'offReq') { if (x.sana < shiftDay(tk, 1)) return { error: 'early' }; DM.dam.unshift({ sana: x.sana.split('-').reverse().join('.'), holat: 'kutilmoqda', sabab: x.sabab || '' }); return att(); }
  if (name === 'mySalary') return sal();
  if (name === 'advReq') { DM.advPending = x.summa; return sal(); }
  return { error: 'unknown' };
}
